quarkus.application.name=thws-hedgefond

quarkus.banner.enabled=false

quarkus.http.port=8080
quarkus.http.root-path=/api

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.cache.caffeine."exchange-rates".expire-after-write=5M
quarkus.cache.caffeine."exchange-rates".maximum-size=4
quarkus.cache.caffeine."candles".expire-after-write=30M
quarkus.cache.caffeine."candles".maximum-size=500
quarkus.cache.caffeine."candles-intraday".expire-after-write=30S
quarkus.cache.caffeine."candles-intraday".maximum-size=500
quarkus.cache.caffeine."quotes".expire-after-write=10S
quarkus.cache.caffeine."quotes".maximum-size=1000

twelvedata.api-key=${TWELVEDATA_API_KEY:demo}
